*{box-sizing:border-box}
html{min-height:100%;background:#02070c}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 16px;color:#f5f7fb;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:radial-gradient(ellipse at 50% 5%,#082638 0%,#04131e 34%,#010407 78%,#000 100%);overflow-x:hidden;position:relative}

<script>
/* Lightweight client-side click protection: blocks synthetic clicks and rapid repeat taps.
   This is friction, not server-side bot/fraud detection. */
(function () {
  const join = document.querySelector('a.join[href*="t.me/"]');
  if (!join) return;
  let lastAccepted = 0;
  let opening = false;
  join.addEventListener('click', function (event) {
    const now = Date.now();
    if (!event.isTrusted || opening || now - lastAccepted < 3000) {
      event.preventDefault();
      event.stopImmediatePropagation();
      return;
    }
    lastAccepted = now;
    opening = true;
    // Fire Subscribe only after a genuine user click on the Telegram join button.
    // This measures the button click, not a confirmed Telegram channel join.
    if (typeof window.fbq === 'function') {
      window.fbq('track', 'Subscribe');
    }
    join.setAttribute('aria-disabled', 'true');
    join.style.pointerEvents = 'none';
    window.setTimeout(function () {
      opening = false;
      join.removeAttribute('aria-disabled');
      join.style.pointerEvents = '';
    }, 3000);
  }, true);
})();
</script>
